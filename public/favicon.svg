<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Background Container -->
  <rect width="512" height="512" rx="112" fill="#0A0A0C" />

  <defs>
    <!-- Sharp Futuristic Accent Gradient -->
    <linearGradient id="orangeGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5500" />
      <stop offset="100%" stop-color="#FF8800" />
    </linearGradient>
  </defs>

  <g transform="translate(0, 0)">
    <!-- Main Minimalist Geometric 'Portal / Chevron' (White) -->
    <path 
      d="M 140 372 L 256 140 L 372 372 L 304 372 L 256 272 L 208 372 Z" 
      fill="#FFFFFF" 
    />

    <!-- Accent Node (Future Orange) -->
    <!-- Positioned precisely at the apex gap to create dynamic tension and high visibility at 16x16 -->
    <polygon 
      points="256,80 292,128 220,128" 
      fill="url(#orangeGlow)" 
    />
    
    <!-- Horizon Line Accent Dot -->
    <circle 
      cx="256" 
      cy="340" 
      r="18" 
      fill="url(#orangeGlow)" 
    />
  </g>
</svg>
