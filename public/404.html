<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Fideljon | Portfolio</title>
    <script type="text/javascript">
      (function (l) {
        // GitHub Pages SPA fallback: rewrite /some/path into the query form that
        // index.html understands.
        //
        // GitHub Pages is the only host that needs this, because it is the only
        // one that serves 404.html for unknown paths. Hosts with real SPA
        // rewrites (Vercel) serve index.html directly, so running the rewrite
        // there can only cause harm.
        if (!/(^|\.)github\.io$/.test(l.hostname)) return;

        // It must also be idempotent: if the URL has already been rewritten,
        // running this again would re-encode an encoded URL on every reload and
        // grow the URL forever -- the "/~and~/~and~/..." loop.
        if (l.pathname.indexOf("~and~") !== -1) return;
        if (l.search.indexOf("~and~") !== -1) return;
        if (l.search.charAt(1) === "/") return;

        var pathSegmentsToKeep = 1;

        l.replace(
          l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
          l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
        );
      }(window.location));
    </script>
  </head>
  <body>
  </body>
</html>
